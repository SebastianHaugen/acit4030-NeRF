# ============================================================
# config.yaml - single source of truth for our code
# (baseline/, data/ and src/load_nerf_data.py are not configured here)
# ============================================================

# Preview
preview:
  the-preview: "Working successfully"

# Which dataset train.py uses: lego | poster
active_dataset: lego


# ------------------------------------------------------------
# Shared settings (used for every dataset)
# ------------------------------------------------------------
model:
  n_harmonic_functions: 60     # sin/cos pairs per input coordinate
  omega0: 0.1                  # base frequency of the harmonic embedding
  n_hidden_neurons: 256        # width of the MLP layers

render:
  n_rays_per_image: 750        # random rays per image per training step
  n_pts_per_ray: 128           # sample points along each ray
  n_batches_full_render: 16    # chunks for full-image renders (more = less memory)

train:
  n_iter: 3000
  batch_size: 2                # images per step (baseline book value: 6)
  learning_rate: 1.0e-3
  lr_decay_at: 0.75            # fraction of n_iter where the LR drops
  lr_decay_factor: 0.1         # LR multiplier at that point
  huber_scaling: 0.1           # scaling of the Huber loss
  seed: 1
  vis_every: 100               # save a preview image every N iterations
  checkpoint_every: 500        # save a checkpoint every N iterations


# ------------------------------------------------------------
# Per-dataset settings
# Paths are relative to the project root.
# resize_to is [height, width], or null for full resolution.
# ------------------------------------------------------------
datasets:
  lego:
    data_dir: data/lego
    output_dir: outputs/lego
    resize_to: [200, 200]
    znear: 0.01                # camera clipping planes (passed to load_nerf_data)
    zfar: 10.0
    min_depth: 2.0             # ray sampling range (starting point, verify)
    max_depth: 6.0
    use_silhouette_loss: true  # lego has an alpha channel
    test_every: null           # lego ships its own test split

  poster:
    data_dir: data/poster
    output_dir: outputs/poster
    resize_to: [480, 270]      # 1920x1080 / 4, keeps the aspect ratio
    znear: 0.01
    zfar: 10.0
    min_depth: 0.1             # placeholder - tune after the first run
    max_depth: 6.0             # placeholder - tune after the first run
    use_silhouette_loss: false # no alpha channel, silhouette is all ones
    test_every: 8              # hold out every 8th image as test